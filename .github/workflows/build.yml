name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Gradle) + JDK 8 (toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E -A3 "error:|warning: \[|What went wrong|Exception" build.log | head -120 > errors.txt || true
          split -l 12 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
            echo "::error::$msg"
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fpvdrones-jar
          path: build/libs/*.jar
