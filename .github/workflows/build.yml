name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Gradle) + JDK 8 (toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fpvdrones-jar
          path: build/libs/*.jar
